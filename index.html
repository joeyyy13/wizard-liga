<style>
:root{--bg:#f4f2ef;--fg:#1a1a1f;--mut:#74727a;--card:#fff;--bd:#e4e1dc;--ac:#5b3fd0;--acfg:#fff;--up:#1a8a3f;--dn:#d03030;--cl:#c99a12;--kl:#2e8b57;--sh:0 6px 24px rgba(40,30,80,.10);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.rp{display:flex;align-items:center;padding:6px 11px;border-radius:99px;border:1px solid var(--bd);background:transparent;color:var(--fg);font-size:15px;line-height:1.2;white-space:nowrap;transition:background .25s,border-color .25s,padding .3s cubic-bezier(.3,1.2,.5,1)}

.scroll{overflow-x:auto}
table{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;width:100%}

.vc{box-sizing:border-box;background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:16px;padding:12px 16px;display:flex;align-items:center;gap:14px;position:absolute;left:10px;right:10px;top:64px;z-index:5;pointer-events:none;overflow:hidden;box-shadow:var(--sh);animation:vcin .55s cubic-bezier(.2,1.4,.4,1) forwards,vcout .4s ease-in 5.6s forwards}

#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,40px);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:700;font-size:14px;opacity:0;transition:all .35s;z-index:60;pointer-events:none}

.hr{display:flex;align-items:center;gap:8px}
.acts{transition:opacity .25s,visibility 0s}

body[data-role="cl"] #lg-kl .acts .pr,body[data-role="kl"] #lg-cl .acts .pr,body[data-role="cl"] #lg-kl .body.setup,body[data-role="kl"] #lg-cl .body.setup{display:none}
.ib.dng{background:var(--dn);border-color:var(--dn);color:#fff}

.rc{width:min(92%,380px);display:flex;flex-direction:column;gap:12px;text-align:center}
.rt{font-size:30px;font-weight:900}

.dl{position:absolute;right:58px;font-size:13px;font-weight:800;animation:fl 1.8s both;pointer-events:none}

@keyframes fl{0%{opacity:0;transform:translateY(8px)}20%{opacity:1}100%{opacity:0;transform:translateY(-22px)}}
#sheet{border-top:4px solid var(--c,var(--ac))}

.st b.pp{animation:pp .3s}
@keyframes pp{50%{transform:scale(1.6)}}
.qr{background:#fff;padding:14px;border-radius:16px;width:fit-content;margin:10px auto}
.pl{border-radius:12px;padding:8px 10px;background:var(--bg);border:0;margin-bottom:6px}
.dk{width:90px;font:inherit;padding:8px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);margin:4px 0}

.pl .nm{white-space:normal;overflow:visible}
@media (min-width:900px){main{max-width:720px}.tt{font-size:21px}.r{font-size:19px}.sub{font-size:14px}}

.t-w{background:radial-gradient(circle at 50% 40%,#5b3fd0,#1a1038 70%)}

.fx{position:absolute;inset:0;overflow:hidden;pointer-events:none}

  if(a==="setrole"){setRole(el.getAttribute("data-r"));return}
  if(a==="role"){openRole();return}
  if(a==="rolex"){$("role").classList.remove("on");return}
  if(a==="qr"){openQr();return}
  if(a==="newgame"){
    var nk=el.getAttribute("data-k");
    if(role!==nk){toast("Nur der Schreiber dieses Tisches kann das");return}
    if(!ngArm[nk]){ngArm[nk]=true;el.textContent="Wirklich neu starten?";el.classList.add("dng");setTimeout(function(){if(ngArm[nk]&&el.getAttribute("data-a")==="newgame"){ngArm[nk]=false;el.textContent="Neues Spiel";el.classList.remove("dng")}},4000);return}
    ngArm[nk]=false;S[nk]={names:[],rounds:[]};draft[nk]={};save();update(nk);return;
  }
  if(a==="cst"&&cur&&cur.mode==="cell"){var nv=cur.v+parseInt(el.getAttribute("data-d"),10);if(nv<0||nv>cur.mx)return;cur.v=nv;cellPaint();return}
  if(a==="cback"){var cbk=cur?cur.key:null;if(cbk)openSheet("hist",cbk);else closeSheet();return}
  if(a==="csave"&&cur&&cur.mode==="cell"){var cT=S[cur.key],cR=cT.rounds[cur.ri];if(role!==cur.key||!cR)return;cR.t[cur.ci]=cur.v;var ckk=cur.key,cri=cur.ri;save();update(ckk);openSheet("hist",ckk);toast("Runde "+(cri+1)+": Stiche geändert ✓");return}
  if(a==="chl"){var ch=el.closest(".chart"),hh=el.getAttribute("data-h");if(!ch)return;if(ch.getAttribute("data-hl")===hh){ch.removeAttribute("data-hl");el.classList.remove("on")}else{ch.setAttribute("data-hl",hh);[].forEach.call(ch.querySelectorAll(".lgi"),function(x){x.classList.toggle("on",x===el)})}return}
  if(a==="png"){saveBlock(el.getAttribute("data-k"));return}
  if(a==="pvw"){var pk=el.getAttribute("data-k"),pi2=parseInt(el.getAttribute("data-pi"),10);if(S[pk]&&S[pk].names[pi2]!==undefined)openPlayer(pk,pi2,el.getAttribute("data-v"));return}
  if(a==="svw"){var sk=el.getAttribute("data-k");sv[sk]=el.getAttribute("data-v");openSheet("stat",sk);return}
  if(a==="vw"){var vk=el.getAttribute("data-k");hv[vk]=el.getAttribute("data-v");openSheet("hist",vk);return}
  if(a==="edr"){var ek=el.getAttribute("data-k");if(role!==ek)return;openSheet("entry",ek,parseInt(el.getAttribute("data-ri"),10));return}
  if(a==="promo"){doPromo(el);return}
  if(a==="blk"){var bk=el.getAttribute("data-k");hv[bk]=hv[bk]==="block"?"list":"block";openSheet("hist",bk);return}
  if(a==="entry"||a==="hist"||a==="stat")openSheet(a,el.getAttribute("data-k"));
  else if(a==="close")closeSheet();
  else if(a==="save"&&cur){
    var key=cur.key,T2=S[key],n=T2.names.length,b=[],t=[],D2=draft[key];
    var aa=[];for(var j=0;j<n;j++){b.push(D2["b"+j]||0);t.push(D2["t"+j]||0);aa.push(D2["a"+j]||0)}
    if(cur.edit!=null){var ed2=cur.edit;T2.rounds[ed2]={b:b,t:t,a:aa};draft[key]=stashD[key]||{};delete stashD[key];save();update(key);openSheet("hist",key);toast("Runde "+(ed2+1)+" geändert ✓");return}
    T2.rounds.push({b:b,t:t,a:aa});T2.redo=[];draft[key]={};save();closeSheet();
    setTimeout(function(){update(key);toast("Runde "+T2.rounds.length+" gespeichert ✓")},calm?0:300);vestCheck(T2,key);
  }
  else if(a==="undo"&&cur&&role===cur.key){var T3=S[cur.key];if(T3.rounds.length){T3.redo=(T3.redo||[]).concat(T3.rounds.pop());save();update(cur.key);openSheet("hist",cur.key)}}
  else if(a==="redo"&&cur&&role===cur.key){var T4=S[cur.key];if(T4.redo&&T4.redo.length){T4.rounds.push(T4.redo.pop());save();update(cur.key);openSheet("hist",cur.key)}}
  else if(a==="reset"&&cur&&role===cur.key){
    if(!resetArm){resetArm=true;el.textContent="Wirklich zurücksetzen?";el.classList.add("dng");setTimeout(function(){if(resetArm&&el.isConnected){resetArm=false;el.textContent="Tisch zurücksetzen";el.classList.remove("dng")}},4000);return}
    var kk=cur.key;S[kk]={names:[],rounds:[]};draft[kk]={};save();closeSheet();update(kk);
  }
});
["cl","kl"].forEach(function(k){$("body-"+k).addEventListener("click",function(e){
  if(e.target.closest("button"))return;
  if(!e.target.closest(".pn"))return;var row=e.target.closest(".r");if(!row||!row.parentNode)return;
  var i=[].indexOf.call(row.parentNode.children,row);
  if(i>=0&&S[k].names[i]!==undefined)openPlayer(k,i);
})});
$("sheet").addEventListener("click",function(e){
  var td=e.target.closest("td[data-ri]");if(!td||!cur||cur.mode!=="hist"||role!==cur.key)return;
  openCell(cur.key,parseInt(td.getAttribute("data-ri"),10),parseInt(td.getAttribute("data-ci"),10));
});
document.addEventListener("keydown",function(e){var t=e.target;if(e.key==="Enter"&&t.classList&&t.classList.contains("nn")){e.preventDefault();addName(t.closest(".lg").id.slice(3),t)}});
document.addEventListener("gesturestart",function(e){e.preventDefault()});
$("bk").onclick=closeSheet;
$("cele").onclick=endAct;
applyRole();

if(window.claude&&claude.use){
  claude.use("db").then(function(db){
    if(!db){return}
    ref=db.doc("wizard/state");
    ref.onSnapshot(function(snap){
      if(!snap.exists)return;
      try{var d=JSON.parse(snap.data().json);
        if(d&&d.cl&&d.kl){S=d;try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}KEYS.forEach(update)}
      }catch(e){}
    },function(){});
  }).catch(function(){});
}else if(syncBase){
  pullRemote();setInterval(pullRemote,3000);
  document.addEventListener("visibilitychange",function(){if(!document.hidden)pullRemote()});
}else setSync(false,"nur lokal");
})();
</script></body></html>
