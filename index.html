<style>
:root{--bg:#f4f2ef;--fg:#1a1a1f;--mut:#74727a;--card:#fff;--bd:#e4e1dc;--ac:#5b3fd0;--acfg:#fff;--up:#1a8a3f;--dn:#d03030;--cl:#c99a12;--kl:#2e8b57;--sh:0 6px 24px rgba(40,30,80,.10);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101015;--fg:#f0eef5;--mut:#9a98a4;--card:#1b1b24;--bd:#2c2c38;--ac:#9b86ff;--acfg:#14121f;--up:#4cc26b;--dn:#ff6b6b;--cl:#f0c040;--kl:#4cc58a;--sh:0 6px 24px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101015;--fg:#f0eef5;--mut:#9a98a4;--card:#1b1b24;--bd:#2c2c38;--ac:#9b86ff;--acfg:#14121f;--up:#4cc26b;--dn:#ff6b6b;--cl:#f0c040;--kl:#4cc58a;--sh:0 6px 24px rgba(0,0,0,.4);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:520px;margin:0 auto;padding:10px 12px 20px}
header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;padding:4px 2px 10px;contain:layout style}
@media (max-width:540px){.seg3{width:100%;margin-left:0}}
h1{font-size:20px;margin:0;letter-spacing:.2px}
.hl{display:flex;align-items:baseline;gap:10px}
#sync{font-size:12px;color:var(--mut)}
.rb.cur{box-shadow:0 0 0 3px var(--ac),var(--sh);background:color-mix(in srgb,var(--ac) 12%,var(--card))}
.seg3{display:flex;align-items:center;gap:6px;margin-left:auto}
.rp{display:flex;align-items:center;padding:6px 11px;border-radius:99px;border:1px solid var(--bd);background:transparent;color:var(--fg);font-size:15px;line-height:1.2;white-space:nowrap;transition:background .25s,border-color .25s,padding .3s cubic-bezier(.3,1.2,.5,1)}
.rp[data-r="cl"]{--c:var(--cl)}.rp[data-r="kl"]{--c:var(--kl)}
.rp:active{transform:scale(.95)}
.rp i{font-style:normal;transition:font-size .3s cubic-bezier(.3,1.2,.5,1)}
.rp .rt2{display:grid;grid-template-columns:0fr;opacity:0;margin-left:0;transition:grid-template-columns .32s cubic-bezier(.3,1.1,.5,1),opacity .25s,margin .32s}
.rp .rin{display:flex;flex-direction:column;text-align:left;min-width:0;overflow:hidden}
.rp small{font-size:10px;font-weight:600;color:var(--mut)}
.rp b{font-size:14px}
.rp.on{padding:6px 14px 6px 11px;background:color-mix(in srgb,var(--c,var(--ac)) 18%,transparent);border-color:var(--c,var(--ac))}
.rp.on i{font-size:20px}
.rp.on .rt2{grid-template-columns:1fr;opacity:1;margin-left:7px}
#rx{align-self:center;margin-top:4px;padding:10px 24px}
#sync.live::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--up);margin-right:6px;animation:pulse 1.8s infinite}
@keyframes pulse{50%{opacity:.25;transform:scale(.7)}}
.lg{background:var(--card);border-radius:16px;box-shadow:var(--sh);margin-bottom:14px;overflow:hidden;border-top:4px solid var(--c);animation:rise .5s both}
.lg.cl{--c:var(--cl)}.lg.kl{--c:var(--kl);animation-delay:.1s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.lh{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px 6px}
.tt{font-weight:800;font-size:17px}
.sub{font-size:12px;color:var(--mut)}
.acts{display:flex;gap:6px}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ib{padding:7px 11px;border-radius:99px;border:1px solid var(--bd);background:transparent;color:var(--fg);font-size:13px;font-weight:600;transition:transform .12s}
.ib.pr{background:var(--c);border-color:var(--c);color:#161616}
.ib:active,.big:active,.st button:active{transform:scale(.93)}
.body{padding:2px 14px 12px}
.list{position:relative}
.r{position:absolute;left:0;right:0;height:36px;display:flex;align-items:center;gap:8px;border-radius:10px;padding:0 6px;box-sizing:border-box;transition:transform .85s cubic-bezier(.34,1.25,.5,1);animation:fi .5s both}
@keyframes fi{from{opacity:0}}
.r:nth-child(odd){background:color-mix(in srgb,var(--fg) 4%,transparent)}
.r.fu{animation:gu 1.3s}.r.fd{animation:gd 1.3s}
@keyframes gu{0%,60%{background:color-mix(in srgb,var(--up) 35%,transparent)}}
@keyframes gd{0%,60%{background:color-mix(in srgb,var(--dn) 30%,transparent)}}
.rk{width:22px;text-align:center;font-weight:800;color:var(--mut)}
.r.p1 .rk{color:var(--c)}
.mv{width:40px;font-size:12px;font-weight:800;color:var(--mut)}
.mv.u{color:var(--up);animation:bu .7s}.mv.d{color:var(--dn);animation:bd .7s}
@keyframes bu{40%{transform:translateY(-6px) scale(1.25)}}
@keyframes bd{40%{transform:translateY(6px) scale(1.25)}}
.nm{flex:1;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bg{font-style:normal;font-size:10px;font-weight:800;margin-left:6px;padding:1px 7px;border-radius:99px;border:1px solid currentColor;animation:pop .4s}
.bg.up{color:var(--up)}.bg.dn{color:var(--dn)}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.pt{min-width:46px;text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.setup textarea{width:100%;box-sizing:border-box;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;margin:6px 0}
.note{font-size:13px;color:var(--mut)}
.big{width:100%;padding:13px;border:0;border-radius:12px;background:var(--ac);color:var(--acfg);font-size:16px;font-weight:800;margin-top:10px;transition:transform .12s,opacity .2s}
.big:disabled{opacity:.35}
.err{color:var(--dn);font-size:13px;min-height:16px}
#ov{position:fixed;inset:0;z-index:50;pointer-events:none}
#ov .bk{position:absolute;inset:0;background:rgba(10,8,20,.5);backdrop-filter:blur(4px);opacity:0;transition:opacity .3s}
#sheet{position:absolute;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;max-height:88%;overflow:auto;background:var(--card);border-radius:22px 22px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));box-sizing:border-box;transform:translateY(105%);transition:transform .4s cubic-bezier(.2,.9,.3,1);box-shadow:0 -10px 40px rgba(0,0,0,.3)}
#ov.on{pointer-events:auto}#ov.on .bk{opacity:1}#ov.on #sheet{transform:none}
.grab{width:42px;height:5px;border-radius:9px;background:var(--bd);margin:0 auto 10px}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sh b{font-size:18px}
.x{border:0;background:var(--bg);color:var(--fg);width:32px;height:32px;border-radius:50%;font-size:16px}
.pl{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd);animation:fi .4s both}
.pl .nm{flex:1}
.st{display:flex;align-items:center;gap:6px}
.st button{width:34px;height:34px;border-radius:50%;border:1px solid var(--bd);background:var(--bg);color:var(--fg);font-size:18px;font-weight:700;transition:transform .12s}
.st b{width:22px;text-align:center;font-variant-numeric:tabular-nums}
.cap{display:flex;gap:8px;font-size:11px;color:var(--mut);justify-content:flex-end;padding-right:2px}
.cap span{width:98px;text-align:center}
.sum{margin-top:10px;font-weight:700;text-align:center;transition:color .2s}
.sum.ok{color:var(--up)}.sum.bad{color:var(--dn)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;width:100%}
th,td{padding:6px 7px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td.p{color:var(--up)}td.m{color:var(--dn)}
.row2{display:flex;gap:8px;margin-top:12px}
.row2 .ib{flex:1}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,40px);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:700;font-size:14px;opacity:0;transition:all .35s;z-index:60;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
.hr{display:flex;align-items:center;gap:8px}
.acts{transition:opacity .25s,visibility 0s}
body[data-role="z"] .acts{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .25s,visibility 0s .25s}
body[data-role="cl"] #lg-kl .acts,body[data-role="kl"] #lg-cl .acts{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .25s,visibility 0s .25s}
#role{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;background:var(--bg);opacity:0;pointer-events:none;transition:opacity .35s}
#role.on{opacity:1;pointer-events:auto}
.rc{width:min(92%,380px);display:flex;flex-direction:column;gap:12px;text-align:center}
.rt{font-size:30px;font-weight:900}
.rb{border:0;border-radius:16px;padding:16px;background:var(--card);color:var(--fg);box-shadow:var(--sh);font-size:17px;font-weight:800;display:flex;flex-direction:column;gap:2px;transition:transform .15s;animation:rise .5s both}
.rb:nth-of-type(2){animation-delay:.08s}.rb:nth-of-type(3){animation-delay:.16s}
.rb small{font-weight:500;color:var(--mut);font-size:13px}
.rb:active{transform:scale(.96)}
#banner{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));width:min(92%,480px);box-sizing:border-box;transform:translate(-50%,-160%);z-index:80;padding:12px 16px;border-radius:16px;background:linear-gradient(135deg,var(--c,var(--ac)),color-mix(in srgb,var(--c,var(--ac)) 50%,#000));color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.45);font-weight:800;font-size:17px;box-shadow:0 10px 30px rgba(0,0,0,.35);text-align:center;transition:transform .5s cubic-bezier(.3,1.4,.5,1);pointer-events:none}
#banner small{display:block;font-size:11px;font-weight:700;opacity:.9;margin-bottom:2px}
#banner.cl{--c:var(--cl)}#banner.kl{--c:var(--kl)}
#banner.on{transform:translate(-50%,0)}
.dl{position:absolute;right:58px;font-size:13px;font-weight:800;animation:fl 1.8s both;pointer-events:none}
.dl.p{color:var(--up)}.dl.m{color:var(--dn)}
@keyframes fl{0%{opacity:0;transform:translateY(8px)}20%{opacity:1}100%{opacity:0;transform:translateY(-22px)}}
#sheet{border-top:4px solid var(--c,var(--ac))}
#sheet.cl{--c:var(--cl)}#sheet.kl{--c:var(--kl)}
#sheet .big{background:var(--c,var(--ac));color:#161616}
.st b.pp{animation:pp .3s}
@keyframes pp{50%{transform:scale(1.6)}}
.qr{background:#fff;padding:14px;border-radius:16px;width:fit-content;margin:10px auto}
.pl{border-radius:12px;padding:8px 10px;background:var(--bg);border:0;margin-bottom:6px}
.dk{width:90px;font:inherit;padding:8px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);margin:4px 0}
.seg{display:flex;gap:6px;margin:6px 0}
.sg{flex:1;padding:9px;border-radius:10px;border:1px solid var(--bd);background:transparent;color:var(--fg);font-weight:700;transition:transform .12s,background .2s}
.sg.on{background:var(--c,var(--ac));color:#161616;border-color:transparent}
.sg:active{transform:scale(.95)}
.rbw{border:1px solid var(--bd);background:transparent;color:var(--mut);border-radius:99px;font-size:11px;font-weight:700;padding:2px 9px;margin-top:3px;transition:background .2s}
.rbw.on{background:var(--c,var(--ac));color:#161616;border-color:transparent}
.rbw+.rbw{margin-left:5px}
.pl .nm{white-space:normal;overflow:visible}
@media (min-width:900px){main{max-width:720px}.tt{font-size:21px}.r{font-size:19px}.sub{font-size:14px}}
.cb{margin:4px 0 0;font-size:12px}
#cele{position:fixed;inset:0;z-index:90;opacity:0;pointer-events:none;transition:opacity .5s}
#cele.on{opacity:1;pointer-events:auto}
.cs{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px 20px 170px;box-sizing:border-box;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.5);overflow:hidden}
.t-w{background:radial-gradient(circle at 50% 40%,#5b3fd0,#1a1038 70%)}
.t-u{background:radial-gradient(circle at 50% 60%,#1d8f4a,#08301a 75%)}
.t-d{background:radial-gradient(circle at 50% 40%,#5a5f70,#14151b 75%)}
.hero{font-size:min(30vw,170px);line-height:1.1;z-index:2}
.cs small{font-size:15px;letter-spacing:1px;font-weight:700;opacity:.9;z-index:2}
.cs h2{font-size:min(10vw,48px);margin:6px 0;z-index:2;animation:popin .7s .2s both}
.names{font-size:min(8vw,36px);font-weight:900;z-index:2;animation:popin .8s .5s both}
.fx{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.spk{position:absolute;left:var(--l);font-size:var(--s);animation-delay:var(--d);animation-duration:var(--t);animation-iteration-count:infinite;animation-timing-function:linear}
.spk.f{top:-10%;animation-name:fallp}
.spk.r{bottom:-10%;animation-name:risep}
@keyframes fallp{to{transform:translateY(115vh) rotate(360deg)}}
@keyframes risep{to{transform:translateY(-115vh) rotate(25deg)}}
.dot{position:absolute;width:8px;height:8px;border-radius:50%;left:var(--x);top:var(--y);background:var(--c);opacity:0;animation:burst 1.4s var(--d) infinite ease-out}
@keyframes burst{0%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(var(--dx),var(--dy))}}
.ring{position:absolute;left:50%;top:40%;width:min(90vw,520px);aspect-ratio:1;margin:calc(min(90vw,520px) / -2) 0 0 calc(min(90vw,520px) / -2);border-radius:50%;background:conic-gradient(#ffd54a,#b388ff,#40c4ff,#ffd54a);opacity:.35;animation:spin 5s linear infinite}
.flash{position:absolute;inset:0;background:#fff;opacity:0;animation:fl2 1.8s infinite}
@keyframes fl2{0%,88%,100%{opacity:0}90%{opacity:.7}93%{opacity:.1}95%{opacity:.6}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes popin{0%{transform:scale(0) rotate(-20deg);opacity:0}70%{transform:scale(1.25) rotate(6deg);opacity:1}100%{transform:scale(1)}}
@keyframes bob{50%{transform:translateY(-14px)}}
@keyframes wob{25%{transform:rotate(-12deg) scale(1.1)}75%{transform:rotate(12deg) scale(1.1)}}
.t-w.v0 .hero,.t-w.v1 .hero,.t-u.v1 .hero,.t-u.v2 .hero{animation:popin .9s both,bob 2s .9s infinite ease-in-out}
.t-w.v2 .hero{animation:popin .9s both,wob 1.6s .9s infinite ease-in-out}
.t-u.v0 .hero{animation:flyup 3.2s ease-in both}
@keyframes flyup{0%{transform:translate(-32vw,50vh)}100%{transform:translate(32vw,-70vh)}}
.t-d.v0 .hero{animation:dropb 1.4s both}
@keyframes dropb{0%{transform:translateY(-100vh)}50%{transform:translateY(0)}65%{transform:translateY(-9vh)}80%,100%{transform:translateY(0)}}
.t-d.v1 .hero{animation:holefall 3.6s infinite ease-in}
@keyframes holefall{0%,15%{transform:scale(1) rotate(0)}70%,100%{transform:scale(0) rotate(720deg)}}
.t-d.v2 .hero{animation:bob 2.5s infinite ease-in-out}
.hole{position:absolute;left:50%;top:30%;width:min(44vw,230px);height:min(14vw,70px);transform:translate(-50%,60%);border-radius:50%;background:radial-gradient(#000 55%,transparent 72%)}
#sheet{box-shadow:none}#ov.on #sheet{box-shadow:0 -10px 40px rgba(0,0,0,.3)}
#banner{box-shadow:none}#banner.on{box-shadow:0 10px 30px rgba(0,0,0,.35)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{padding:9px 14px;border-radius:99px;border:1px solid var(--bd);background:transparent;color:var(--fg);font-weight:700;font-size:15px;transition:transform .12s,background .2s}
.chip.on{background:var(--c);color:#161616;border-color:transparent;transform:scale(1.05)}
.chip:active{transform:scale(.93)}
.addrow{display:flex;gap:8px;margin:6px 0 10px}
.nn{flex:1;min-width:0;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:9px}
.sc{position:relative;width:min(56vw,250px);margin:0 auto 6px;z-index:2;perspective:700px}
.wz{width:100%;height:auto;overflow:visible;display:block;animation:walkin 1s cubic-bezier(.2,.8,.3,1) both}
@keyframes walkin{from{transform:translateX(-70vw)}}
.arm{transform-origin:128px 124px;animation:cast 1.5s 1s both}
@keyframes cast{0%{transform:rotate(0)}35%{transform:rotate(16deg)}60%{transform:rotate(-24deg) translateY(-8px)}100%{transform:rotate(-8deg) translateY(-4px)}}
.orb{transform-box:fill-box;transform-origin:center;animation:glow .9s 1s infinite alternate}
@keyframes glow{from{transform:scale(1)}to{transform:scale(1.7);opacity:.75}}
.hat{transform-box:fill-box;transform-origin:center}
.crown,.medal{position:absolute;left:50%;top:-4%;font-size:min(14vw,56px);z-index:3;transform:translateX(-50%);animation:crown 1s 1.6s cubic-bezier(.3,1.6,.5,1) both}
@keyframes crown{from{transform:translate(-50%,-380px) rotate(-40deg);opacity:0}to{transform:translate(-50%,0)}}
.circ{position:absolute;left:50%;bottom:-8%;width:130%;aspect-ratio:1;margin-left:-65%;border-radius:50%;border:3px dashed #ffd54a;box-shadow:0 0 30px #b388ff,inset 0 0 30px #b388ff;transform:rotateX(70deg);animation:cspin 7s linear infinite}
@keyframes cspin{from{transform:rotateX(70deg) rotateZ(0)}to{transform:rotateX(70deg) rotateZ(360deg)}}
.beam{position:absolute;left:50%;bottom:0;width:70px;height:0;margin-left:-35px;background:linear-gradient(to top,rgba(255,213,74,.95),rgba(255,213,74,0));filter:blur(3px);animation:beam 1.3s 1.2s both}
@keyframes beam{to{height:130%}}
.lbolt{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;fill:none;stroke:#fff;filter:drop-shadow(0 0 5px #9cf);animation:bolt 1.8s infinite}
.lbolt path{vector-effect:non-scaling-stroke;stroke-width:3px}
@keyframes bolt{0%,86%,100%{opacity:0}88%{opacity:1}91%{opacity:.2}94%{opacity:1}}
.fly{animation:zoom 3.6s 1.3s ease-in both}.fly2{animation:zoom 3.4s 1.5s ease-in both}
@keyframes zoom{0%{transform:none}25%{transform:translateY(-12px)}100%{transform:translate(55vw,-95vh) rotate(-18deg)}}
.pil{position:absolute;left:50%;bottom:-10%;width:150%;height:160%;margin-left:-75%;background:linear-gradient(to top,transparent,rgba(120,255,180,.55),transparent);filter:blur(6px);animation:fi 1.5s .8s both}
.rkt{font-size:min(34vw,150px);line-height:1;text-align:center}
.wzs{position:absolute;width:42%;left:4%;top:-34%}
.hole2{position:absolute;left:50%;bottom:-4%;width:130%;height:64px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(#000 55%,transparent 72%)}
.wzd{animation:fallin 4s 1.2s infinite ease-in}
.wzd .hat{animation:hatoff 4s 1.2s infinite}
@keyframes fallin{0%,12%{transform:none;opacity:1}60%{transform:translateY(110px) scale(.5) rotate(20deg);opacity:1}78%,100%{transform:translateY(200px) scale(.05) rotate(80deg);opacity:0}}

.zap{position:absolute;left:66%;top:6%;width:40%;height:6px;border-radius:4px;background:linear-gradient(90deg,#fff,#7dff9a);transform-origin:left center;transform:rotate(58deg);box-shadow:0 0 14px #7dff9a;animation:zap 1.2s 1.2s infinite}
@keyframes zap{0%,100%{opacity:.2}50%{opacity:1}}
.frog{position:absolute;right:-26%;bottom:2%;font-size:64px;line-height:1;animation:hop 1s 1.3s infinite}
.frog span{position:absolute;left:-34px;top:-36px;font-size:15px;font-weight:900;background:#fff;color:#161616;border-radius:12px;padding:2px 9px;text-shadow:none}
@keyframes hop{50%{transform:translateY(-26px)}}

function queueOvertakes(key,T,old,rk){
  var n=T.names.length;

      if(ps.length)bq.push({k:key,t:(rk[i]===1?"👑 ":"🚀 ")+T.names[i]+" hat "+ps.join(" und ")+" überholt"+(rk[i]===1?" und führt jetzt!":"!")});
    }

var calm=window.matchMedia&&matchMedia("(prefers-reduced-motion:reduce)").matches;
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function pts(b,t){return b===t?20+10*t:-10*Math.abs(b-t)}
function rp(R,i){return pts(Math.max(0,R.b[i]+(R.a?R.a[i]||0:0)),R.t[i])}
function nr(T){return Math.floor(60/T.names.length)+(T.mode==="j"?1:0)}
function rbl(v){return v===1?"🌈 +1":v===-1?"🌈 −1":"🌈 aus"}
function totals(T,k){return T.names.map(function(_,i){var s=0;for(var r=0;r<k;r++)s+=rp(T.rounds[r],i);return s})}
function ranks(t){return t.map(function(x){return 1+t.filter(function(y){return y>x}).length})}
function save(){
  try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
  if(ref)ref.set({json:JSON.stringify(S)}).catch(function(){});
}
function toast(t){var el=$("toast");el.textContent=t;el.classList.add("on");setTimeout(function(){el.classList.remove("on")},1900)}
function countTo(el,a,b){
  if(calm||a===b){el.textContent=b;return}
  var t0=performance.now();
  (function f(t){var p=Math.min(1,(t-t0)/800);p=1-Math.pow(1-p,3);el.textContent=Math.round(a+(b-a)*p);if(p<1)requestAnimationFrame(f)})(t0);
}
var PRESETS=["Ju","Joey","Hadinger","Felix","Paul Pro","Simon","Saskia","Michel","Folki","Ulli"],sel={cl:[],kl:[]},cust=[];
try{localStorage.removeItem("wizard-names")}catch(e){}

function update(key){
  var T=S[key],body=$("body-"+key),n=T.names.length;
  if(!n){
    shown[key]=null;body.className="body setup";body.style.height="";$("sub-"+key).textContent="Tisch anlegen";
    if(role!==key){body.innerHTML='<div class="note">Dieser Tisch wurde noch nicht angelegt.</div><button class="ib pr" data-a="setrole" data-r="'+key+'" style="margin-top:8px">✍️ Als Schreiber anlegen</button>';return}
    body.innerHTML='<div class="note">Spieler antippen (3 bis 6) · <span class="cnt"></span></div><div class="chips">'+PRESETS.concat(cust).map(function(x){return chipHtml(key,x)}).join("")+'</div><div class="addrow"><input class="nn" maxlength="16" placeholder="Anderer Name"><button class="ib" data-a="addn" data-k="'+key+'">+ Hinzufügen</button></div><div class="note">Spielvariante</div><div class="seg"><button class="sg'+(key==="cl"?"":" on")+'" data-a="mode" data-m="k">Klassisch</button><button class="sg'+(key==="cl"?" on":"")+'" data-a="mode" data-m="j">Jubiläum</button></div><div class="note">Jubiläum: eine Runde mehr (Sonderkarten = Spieleranzahl)</div><div class="err"></div><button class="big">Tisch starten</button>';
    setupCount(key);
    body.querySelector(".big").onclick=function(){
      var v=sel[key].slice();
      if(v.length<3||v.length>6){body.querySelector(".err").textContent="Bitte 3 bis 6 Spieler auswählen.";return}
      T.names=v;T.rounds=[];T.mode=body.querySelector(".sg.on").getAttribute("data-m");delete T.deck;cust=cust.filter(function(x){return v.indexOf(x)<0});sel[key]=[];save();update(key);
    };
    return;
  }
  var sig=T.names.join("|");
  if(!shown[key]||shown[key].sig!==sig){
    body.className="body list";body.style.height=(n*H)+"px";
    body.innerHTML=T.names.map(function(nm,i){return '<div class="r" style="animation-delay:'+(i*70)+'ms"><span class="rk"></span><span class="mv"></span><span class="nm">'+esc(nm)+'<em class="bg" hidden></em></span><span class="pt">0</span></div>'}).join("");
    shown[key]={sig:sig,rk:null,pts:T.names.map(function(){return 0}),rows:[].slice.call(body.children)};
  }
  var sh=shown[key],k=T.rounds.length,total=nr(T),tot=totals(T,k),rk=ranks(tot);
  var prev=k>0?ranks(totals(T,k-1)):null;
  var order=T.names.map(function(_,i){return i}).sort(function(a,b){return tot[b]-tot[a]||a-b});
  var pos=[];order.forEach(function(i,j){pos[i]=j});
  var mt=T.mode==="j"?" · Jubiläum":"";$("sub-"+key).textContent=(k>=total?"Endstand nach "+total+" Runden":"Runde "+k+" von "+total)+mt;
  var cutD=tot[order[n-2]],cutU=tot[order[1]];
  var old=sh.rk;

  sh.rows.forEach(function(row,i){

    row.querySelector(".rk").textContent=rk[i];
    row.classList.toggle("p1",rk[i]===1&&k>0);
    var mv=row.querySelector(".mv"),d=prev?prev[i]-rk[i]:0;
    mv.className="mv"+(d>0?" u":d<0?" d":"");
    mv.textContent=d>0?"▲ "+d:d<0?"▼ "+(-d):"–";
    if(sh.rk&&sh.rk[i]!==rk[i]){
      var up=rk[i]<sh.rk[i];row.classList.remove("fu","fd");void row.offsetWidth;row.classList.add(up?"fu":"fd");
    }
    var bg=row.querySelector(".bg"),txt="",cls="";

    if(old&&tot[i]!==sh.pts[i])chip(row,tot[i]-sh.pts[i]);
    countTo(row.querySelector(".pt"),sh.pts[i],tot[i]);
  });
  sh.rk=rk;sh.pts=tot;

  if(k>=total&&pk!==undefined&&pk<total)celebrate(key,T,rk);
}
function sheet(html){$("sheet").innerHTML='<div class="grab"></div>'+html}
function openSheet(mode,key){
  if(role!==key){toast("Nur der Schreiber dieses Tisches kann das");return}
  cur={mode:mode,key:key};resetArm=false;var T=S[key],n=T.names.length;

document.addEventListener("click",function(e){
